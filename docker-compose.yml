services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentverse_web_app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - APP_PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-app_db}
      - JWT_SECRET=${JWT_SECRET:-change_me_for_local_testing}
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: agentverse_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
    name: agentverse_postgres_data
